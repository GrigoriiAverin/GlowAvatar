name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Windows exe
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --onefile --windowed --name GlowAvatar glow_avatar_gui.py

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/GlowAvatar.exe GlowAvatar-windows.exe

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --windowed --name GlowAvatar glow_avatar_gui.py

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../GlowAvatar-macos.zip GlowAvatar.app

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: GlowAvatar-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
